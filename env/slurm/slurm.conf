# Unified two-node Slurm cluster for flash-modelling DGX pair.
# Controller: spark-5da5 (192.168.100.1)
# Compute:    spark-0808 / dgx-peer (192.168.100.2)
#
# Install with: sudo env/slurm/install-cluster.sh controller|compute

ClusterName=flash-dgx
SlurmctldHost=spark-5da5(192.168.100.1)

AuthType=auth/munge
CryptoType=crypto/munge

SlurmUser=slurm
SlurmdUser=root
StateSaveLocation=/var/spool/slurm/ctld
SlurmdSpoolDir=/var/spool/slurm/d

SlurmctldPidFile=/var/run/slurmctld.pid
SlurmdPidFile=/var/run/slurmd.pid

ProctrackType=proctrack/cgroup
TaskPlugin=task/cgroup,task/affinity
ReturnToService=2

MpiDefault=none
MaxJobCount=10000

GresTypes=gpu

SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory

JobAcctGatherType=jobacct_gather/cgroup
AccountingStorageType=accounting_storage/none

SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log

Prolog=/etc/slurm/prolog.sh
Epilog=/etc/slurm/epilog.sh

NodeName=spark-5da5 NodeAddr=192.168.100.1 CPUs=20 RealMemory=124609 Gres=gpu:1 State=UNKNOWN
NodeName=spark-0808 NodeAddr=192.168.100.2 CPUs=20 RealMemory=120513 Gres=gpu:1 State=UNKNOWN

PartitionName=gpu Nodes=spark-5da5,spark-0808 Default=YES MaxTime=48:00:00 State=UP OverSubscribe=NO
PartitionName=cpu Nodes=spark-5da5,spark-0808 MaxTime=48:00:00 State=UP OverSubscribe=EXCLUSIVE
